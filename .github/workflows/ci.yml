name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list is "tools platform-tools", and "tools" is no longer
          # published, which fails the setup. Ask for only what still exists; the next step adds the
          # platform and build-tools this build pins.
          packages: "platform-tools"

      - name: Install the SDK packages the build asks for
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and a debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mcclockwidget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the widget renders
        uses: actions/upload-artifact@v4
        with:
          name: widget-renders
          path: app/build/widget-renders/
          if-no-files-found: error
