name: Release

# Push a tag like v1.0.0 and this builds a signed APK and attaches it to a GitHub Release.
# workflow_dispatch does the same for a tag that already exists, which is the way to retry a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # Pinned rather than ubuntu-latest: that label moves between Ubuntu releases, and a release
    # pipeline should not have its toolchain change underneath it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Work out the version from the tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Decode the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MCCLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The MCCLOCK_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mcclock-release.jks"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build the signed release APK
        env:
          MCCLOCK_KEYSTORE: ${{ runner.temp }}/mcclock-release.jks
          MCCLOCK_KEYSTORE_PASSWORD: ${{ secrets.MCCLOCK_KEYSTORE_PASSWORD }}
          MCCLOCK_KEY_ALIAS: ${{ secrets.MCCLOCK_KEY_ALIAS }}
          MCCLOCK_KEY_PASSWORD: ${{ secrets.MCCLOCK_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ github.run_number }}"

      - name: Check the APK really is signed with the release key
        run: |
          apk="$RUNNER_TEMP/mcclockwidget-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          "$apksigner" verify "$apk"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="$RUNNER_TEMP/mcclockwidget-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing the APK."
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" \
              --title "Minecraft Clock $VERSION" \
              --generate-notes
          fi
          gh release view "$TAG"
