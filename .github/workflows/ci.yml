name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # Pinned rather than ubuntu-latest: that label moves between Ubuntu releases, and a build
    # pipeline should not have its toolchain change underneath it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and a debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mcclockwidget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the widget renders
        uses: actions/upload-artifact@v7
        with:
          name: widget-renders
          path: app/build/widget-renders/
          if-no-files-found: error
